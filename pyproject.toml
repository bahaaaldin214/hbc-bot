[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hbc-bot"
version = "0.1.0"
description = "Discord front-end for the bahaa lab tools (HBC / Voss lab)"
requires-python = ">=3.10"
dependencies = ["discord.py>=2.7,<3", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hbc_bot = ["sql/*.sql", "toolargs.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
